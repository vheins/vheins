<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title description" xml:space="preserve">
  <title id="title">Vheins engineering profile terminal</title>
  <desc id="description">A four-scene animated terminal introducing Muhammad Rheza Alfin, his application stack, infrastructure expertise, open-source projects, and engineering philosophy.</desc>

  <defs>
    <linearGradient id="frame-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30363d" />
      <stop offset="0.48" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="scan-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- The four scenes share this seven-second typewriter timeline. -->
    <clipPath id="row-1-clip">
      <rect x="40" y="57" width="0" height="28">
        <animate attributeName="width" dur="7s" repeatCount="indefinite" values="0;0;405;405;405;0" keyTimes="0;0.02;0.14;0.96;0.99;1" />
      </rect>
    </clipPath>
    <clipPath id="row-2-clip">
      <rect x="40" y="89" width="0" height="29">
        <animate attributeName="width" dur="7s" repeatCount="indefinite" values="0;0;890;890;890;0" keyTimes="0;0.15;0.35;0.96;0.99;1" />
      </rect>
    </clipPath>
    <clipPath id="row-3-clip">
      <rect x="40" y="135" width="0" height="28">
        <animate attributeName="width" dur="7s" repeatCount="indefinite" values="0;0;405;405;405;0" keyTimes="0;0.42;0.55;0.96;0.99;1" />
      </rect>
    </clipPath>
    <clipPath id="row-4-clip">
      <rect x="40" y="167" width="0" height="29">
        <animate attributeName="width" dur="7s" repeatCount="indefinite" values="0;0;890;890;890;0" keyTimes="0;0.56;0.8;0.96;0.99;1" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .terminal-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 18px;
    }
    .scene-meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
    }
    .reduced-motion, .reduced-status { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .animated-content, .scanline, .status-pulse { display: none; }
      .reduced-motion, .reduced-status { display: block; }
    }
  </style>

  <rect x="1" y="1" width="998" height="278" rx="15" fill="#0d1117" stroke="url(#frame-gradient)" stroke-width="2" />
  <rect x="2" y="2" width="996" height="43" rx="13" fill="#161b22" />
  <path d="M2 32 Q2 44 15 44 H985 Q998 44 998 32 V44 H2 Z" fill="#161b22" />
  <line x1="2" y1="44" x2="998" y2="44" stroke="#30363d" />

  <circle cx="24" cy="23" r="6" fill="#ff5f57" />
  <circle cx="45" cy="23" r="6" fill="#febc2e" />
  <circle cx="66" cy="23" r="6" fill="#28c840" />
  <text x="88" y="29" fill="#8b949e" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">vheins@github — ~/profile</text>

  <g class="status-pulse" transform="translate(827 23)">
    <circle cx="0" cy="0" r="4" fill="#3fb950" filter="url(#soft-glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="12" y="5" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">orchestrating</text>
  </g>
  <g class="reduced-status" transform="translate(827 23)">
    <circle cx="0" cy="0" r="4" fill="#3fb950" />
    <text x="12" y="5" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">ready</text>
  </g>

  <rect class="scanline" x="3" y="45" width="994" height="38" fill="url(#scan-gradient)" pointer-events="none">
    <animate attributeName="y" values="45;220;45" dur="6s" repeatCount="indefinite" />
  </rect>

  <g class="animated-content terminal-text">
    <!-- Scene 1: identity -->
    <g opacity="1">
      <animate attributeName="opacity" dur="28s" repeatCount="indefinite" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" />
      <text x="40" y="79" clip-path="url(#row-1-clip)"><tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">whoami</tspan></text>
      <text x="40" y="111" fill="#7ee787" clip-path="url(#row-2-clip)">Muhammad Rheza Alfin · Technical Leader</text>
      <text x="40" y="157" clip-path="url(#row-3-clip)"><tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">role --scope</tspan></text>
      <text x="40" y="189" fill="#7ee787" clip-path="url(#row-4-clip)">Full-Stack Engineering · Architecture · Consulting</text>
      <text x="40" y="252" fill="#8b949e" class="scene-meta">scene 1/4 · identity</text>
      <rect x="814" y="248" width="28" height="4" rx="2" fill="#3fb950" /><rect x="850" y="248" width="28" height="4" rx="2" fill="#30363d" /><rect x="886" y="248" width="28" height="4" rx="2" fill="#30363d" /><rect x="922" y="248" width="28" height="4" rx="2" fill="#30363d" />
    </g>

    <!-- Scene 2: application stack -->
    <g opacity="0">
      <animate attributeName="opacity" dur="28s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" />
      <text x="40" y="79" clip-path="url(#row-1-clip)"><tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">stack --application</tspan></text>
      <text x="40" y="111" fill="#79c0ff" clip-path="url(#row-2-clip)">Laravel · PHP · Filament · Livewire · Vue · Nuxt · NestJS</text>
      <text x="40" y="157" clip-path="url(#row-3-clip)"><tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">stack --data</tspan></text>
      <text x="40" y="189" fill="#79c0ff" clip-path="url(#row-4-clip)">PostgreSQL · MySQL · Redis · REST APIs · Queues</text>
      <text x="40" y="252" fill="#8b949e" class="scene-meta">scene 2/4 · application</text>
      <rect x="814" y="248" width="28" height="4" rx="2" fill="#30363d" /><rect x="850" y="248" width="28" height="4" rx="2" fill="#58a6ff" /><rect x="886" y="248" width="28" height="4" rx="2" fill="#30363d" /><rect x="922" y="248" width="28" height="4" rx="2" fill="#30363d" />
    </g>

    <!-- Scene 3: infrastructure and expertise -->
    <g opacity="0">
      <animate attributeName="opacity" dur="28s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" />
      <text x="40" y="79" clip-path="url(#row-1-clip)"><tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">stack --infrastructure</tspan></text>
      <text x="40" y="111" fill="#ffa657" clip-path="url(#row-2-clip)">Linux · Docker · Nginx · HAProxy · Patroni · PHP-FPM</text>
      <text x="40" y="157" clip-path="url(#row-3-clip)"><tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">specialize</tspan></text>
      <text x="40" y="189" fill="#ffa657" clip-path="url(#row-4-clip)">ERP Architecture · Performance Tuning · Integration · Automation</text>
      <text x="40" y="252" fill="#8b949e" class="scene-meta">scene 3/4 · systems</text>
      <rect x="814" y="248" width="28" height="4" rx="2" fill="#30363d" /><rect x="850" y="248" width="28" height="4" rx="2" fill="#30363d" /><rect x="886" y="248" width="28" height="4" rx="2" fill="#f97316" /><rect x="922" y="248" width="28" height="4" rx="2" fill="#30363d" />
    </g>

    <!-- Scene 4: open source and philosophy -->
    <g opacity="0">
      <animate attributeName="opacity" dur="28s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" />
      <text x="40" y="79" clip-path="url(#row-1-clip)"><tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">building --open-source</tspan></text>
      <text x="40" y="111" fill="#d2a8ff" clip-path="url(#row-2-clip)">Local Memory MCP · Rustasea · OpenCode Tooling</text>
      <text x="40" y="157" clip-path="url(#row-3-clip)"><tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">philosophy</tspan></text>
      <text x="40" y="189" fill="#d2a8ff" clip-path="url(#row-4-clip)">simplify → automate → optimize → reuse → orchestrate</text>
      <text x="40" y="252" fill="#8b949e" class="scene-meta">scene 4/4 · open source</text>
      <rect x="814" y="248" width="28" height="4" rx="2" fill="#30363d" /><rect x="850" y="248" width="28" height="4" rx="2" fill="#30363d" /><rect x="886" y="248" width="28" height="4" rx="2" fill="#30363d" /><rect x="922" y="248" width="28" height="4" rx="2" fill="#d2a8ff" />
    </g>
  </g>

  <!-- Accessible static summary when the viewer asks for reduced motion. -->
  <g class="reduced-motion terminal-text">
    <text x="40" y="79" fill="#7ee787">Muhammad Rheza Alfin · Technical Leader · Full-Stack Engineer</text>
    <text x="40" y="119" fill="#79c0ff">Laravel · Rust · Vue · PostgreSQL · Linux · Docker</text>
    <text x="40" y="159" fill="#ffa657">ERP Architecture · Performance · Integration · Automation</text>
    <text x="40" y="199" fill="#d2a8ff">Local Memory MCP · Rustasea · OpenCode Tooling</text>
    <text x="40" y="244" fill="#8b949e" class="scene-meta">simplify → automate → optimize → reuse → orchestrate</text>
  </g>
</svg>
