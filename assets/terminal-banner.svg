<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title description" xml:space="preserve">
  <title id="title">Vheins engineering profile terminal</title>
  <desc id="description">An animated terminal introducing Muhammad Rheza Alfin, his current projects, and his engineering philosophy.</desc>

  <defs>
    <linearGradient id="frame-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30363d" />
      <stop offset="0.48" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="scan-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="line-1-clip">
      <rect x="40" y="57" width="0" height="28">
        <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;248;248;248;0" keyTimes="0;0.02;0.12;0.94;0.98;1" />
      </rect>
    </clipPath>
    <clipPath id="line-2-clip">
      <rect x="40" y="89" width="0" height="29">
        <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;505;505;505;0" keyTimes="0;0.13;0.29;0.94;0.98;1" />
      </rect>
    </clipPath>
    <clipPath id="line-3-clip">
      <rect x="40" y="127" width="0" height="28">
        <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;330;330;330;0" keyTimes="0;0.3;0.4;0.94;0.98;1" />
      </rect>
    </clipPath>
    <clipPath id="line-4-clip">
      <rect x="40" y="159" width="0" height="29">
        <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;710;710;710;0" keyTimes="0;0.41;0.62;0.94;0.98;1" />
      </rect>
    </clipPath>
    <clipPath id="line-5-clip">
      <rect x="40" y="197" width="0" height="28">
        <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;300;300;300;0" keyTimes="0;0.63;0.72;0.94;0.98;1" />
      </rect>
    </clipPath>
    <clipPath id="line-6-clip">
      <rect x="40" y="229" width="0" height="29">
        <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;735;735;735;0" keyTimes="0;0.73;0.91;0.94;0.98;1" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .terminal-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 18px;
    }
    .reduced-motion { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .animated-content, .scanline { display: none; }
      .reduced-motion { display: block; }
    }
  </style>

  <rect x="1" y="1" width="998" height="278" rx="15" fill="#0d1117" stroke="url(#frame-gradient)" stroke-width="2" />
  <rect x="2" y="2" width="996" height="43" rx="13" fill="#161b22" />
  <path d="M2 32 Q2 44 15 44 H985 Q998 44 998 32 V44 H2 Z" fill="#161b22" />
  <line x1="2" y1="44" x2="998" y2="44" stroke="#30363d" />

  <circle cx="24" cy="23" r="6" fill="#ff5f57" />
  <circle cx="45" cy="23" r="6" fill="#febc2e" />
  <circle cx="66" cy="23" r="6" fill="#28c840" />
  <text x="88" y="29" fill="#8b949e" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">vheins@github — ~/profile</text>

  <g transform="translate(827 23)">
    <circle cx="0" cy="0" r="4" fill="#3fb950" filter="url(#soft-glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="12" y="5" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">orchestrating</text>
  </g>

  <rect class="scanline" x="3" y="45" width="994" height="38" fill="url(#scan-gradient)" pointer-events="none">
    <animate attributeName="y" values="45;240;45" dur="6s" repeatCount="indefinite" />
  </rect>

  <g class="animated-content terminal-text">
    <text x="40" y="79" clip-path="url(#line-1-clip)">
      <tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">whoami</tspan>
    </text>
    <text x="40" y="111" fill="#7ee787" clip-path="url(#line-2-clip)">Technical Leader · Full-Stack Engineer</text>

    <text x="40" y="149" clip-path="url(#line-3-clip)">
      <tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">focus --current</tspan>
    </text>
    <text x="40" y="181" fill="#ffa657" clip-path="url(#line-4-clip)">Local Memory MCP · Rustasea · AI-Agent Infrastructure</text>

    <text x="40" y="219" clip-path="url(#line-5-clip)">
      <tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">philosophy</tspan>
    </text>
    <text x="40" y="251" fill="#d2a8ff" clip-path="url(#line-6-clip)">simplify → automate → optimize → reuse → orchestrate</text>

    <rect x="657" y="234" width="10" height="20" rx="1" fill="#c9d1d9">
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.5;0.5;1" />
      <animate attributeName="visibility" dur="12s" repeatCount="indefinite" values="hidden;hidden;visible;visible;hidden" keyTimes="0;0.73;0.91;0.97;1" />
    </rect>
  </g>

  <g class="reduced-motion terminal-text">
    <text x="40" y="79"><tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">whoami</tspan></text>
    <text x="40" y="111" fill="#7ee787">Technical Leader · Full-Stack Engineer</text>
    <text x="40" y="149"><tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">focus --current</tspan></text>
    <text x="40" y="181" fill="#ffa657">Local Memory MCP · Rustasea · AI-Agent Infrastructure</text>
    <text x="40" y="219"><tspan fill="#58a6ff">vheins@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#f0f6fc">philosophy</tspan></text>
    <text x="40" y="251" fill="#d2a8ff">simplify → automate → optimize → reuse → orchestrate</text>
  </g>
</svg>
